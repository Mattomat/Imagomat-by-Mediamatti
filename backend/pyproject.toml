[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imagomat"
version = "1.2.0"
description = "Lokale AI-Foto-Workflow-App: Culling, Personen, Stil-Entwicklung, Lightroom-Export"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "rawpy>=0.21",
  "pillow>=10",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "lightgbm>=4.3",
  "lxml>=5",
  "imagehash>=4.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# KI-Modelle. Auf dem Mac (Apple Silicon) laufen sie über MPS bzw. CoreML.
ml = [
  "torch>=2.3",
  "torchvision>=0.18",
  "open_clip_torch>=2.24",
  "transformers>=4.44",
  "timm>=1.0",
  "onnxruntime>=1.18",
  "insightface>=0.7.3",
  "mediapipe>=0.10.14",
  "einops>=0.8",
  "kornia>=0.7",
]
# Apple Vision OCR (nur macOS) für Rückennummern.
mac = ["ocrmac>=1.0; sys_platform == 'darwin'", "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'"]
ocr = ["easyocr>=1.7"]
scrape = ["requests>=2.31", "beautifulsoup4>=4.12"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
imagomat = "imagomat.cli:main"

[tool.setuptools.packages.find]
include = ["imagomat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
