[package]
name = "tagmatti"
version = "1.4.1"
description = "Tagmatti – lokale AI-Foto-Workflow-App"
edition = "2021"

[lib]
name = "tagmatti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
