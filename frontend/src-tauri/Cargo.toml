[package]
name = "imagomat"
version = "0.2.0"
description = "Imagomat – lokale AI-Foto-Workflow-App"
edition = "2021"

[lib]
name = "imagomat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
