name: Apps (Mac + Windows)

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python-Umgebung
        working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,scrape]"
          # PyTorch mitinstallieren, damit Konflikte (z. B. OpenMP) auffallen
          uv pip install torch
          uv pip install "pyobjc-framework-Quartz>=10.0"
      - name: Tests
        working-directory: backend
        env:
          TAGMATTI_OFFLINE: "1"
        run: .venv/bin/python -X faulthandler -m pytest -q
      - name: Echte Kamera-RAWs (Sony A7 IV u. a.)
        working-directory: backend
        run: |
          mkdir -p /tmp/raws
          for cam in "Sony/ILCE-7M5" "Sony/ILCE-7M4" "Sony/ILCE-1"; do
            url="https://raw.pixls.us/data/$cam/"
            for f in $(curl -sfL "$url" | grep -oiE 'href="[^"]+\.(arw)"' | sed -E 's/href="//;s/"$//' | head -n 2); do
              case "$f" in http*) src="$f" ;; *) src="$url$f" ;; esac
              curl -sfL -o "/tmp/raws/$(basename "$f")" "$src" || true
            done
          done
          ls -la /tmp/raws
          if ls /tmp/raws/* >/dev/null 2>&1; then
            .venv/bin/python ../scripts/ci_real_raw.py /tmp/raws/*
          else
            echo "Keine Beispiel-RAWs erreichbar – übersprungen"
          fi

  app:
    name: DMG bauen
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # rawpy + LibRaw-Entwicklerstand: kennt Kameras, die das offizielle rawpy noch nicht kann (Sony A7 V)
      RAWPY_REF: a39c2e7a44911889c3360891012f862f904ba551
      LIBRAW_REF: d0a7aa653fb5cbf27927d7bcd1851c3396622b58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: uv ins App-Bundle legen
        run: |
          mkdir -p frontend/src-tauri/bin
          curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-aarch64-apple-darwin.tar.gz | tar xz
          cp uv-aarch64-apple-darwin/uv frontend/src-tauri/bin/uv
          chmod +x frontend/src-tauri/bin/uv
      - name: RAW-Leser mit neuester LibRaw (Sony A7 V u. a.) – Cache
        id: rawpy-cache
        uses: actions/cache@v4
        with:
          path: frontend/src-tauri/wheels/*.whl
          key: rawpy-${{ env.RAWPY_REF }}-libraw-${{ env.LIBRAW_REF }}-py312-arm64-nodeps-${{ hashFiles('scripts/rawpy_no_external_deps.py') }}
      - name: RAW-Leser mit neuester LibRaw bauen
        if: steps.rawpy-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          git clone -q https://github.com/letmaik/rawpy.git /tmp/rawpy
          cd /tmp/rawpy
          git checkout -q "$RAWPY_REF"
          git submodule update --init -q external/LibRaw external/LibRaw-cmake
          (cd external/LibRaw && git fetch -q --depth 1 origin "$LIBRAW_REF" && git checkout -q FETCH_HEAD)
          grep -c "ILCE-7M5" external/LibRaw/src/tables/cameralist.cpp
          # Keine Homebrew-Bibliotheken einbinden (fehlen auf den Macs der Nutzer)
          python3 "$GITHUB_WORKSPACE/scripts/rawpy_no_external_deps.py" setup.py
          "$GITHUB_WORKSPACE/frontend/src-tauri/bin/uv" build --wheel --python 3.12 \
            --out-dir "$GITHUB_WORKSPACE/frontend/src-tauri/wheels" .
          ls -la "$GITHUB_WORKSPACE/frontend/src-tauri/wheels"
      - name: RAW-Leser prüfen (nur macOS-Systembibliotheken)
        run: |
          rm -rf /tmp/wcheck && mkdir -p /tmp/wcheck
          unzip -q -o frontend/src-tauri/wheels/rawpy-*.whl -d /tmp/wcheck
          for f in /tmp/wcheck/rawpy/*.so /tmp/wcheck/rawpy/*.dylib; do otool -L "$f"; done | tee /tmp/wcheck/deps.txt
          if grep -E "/opt/homebrew|/usr/local|/opt/local" /tmp/wcheck/deps.txt; then
            echo "::error::RAW-Leser hängt von Bibliotheken ab, die auf Nutzer-Macs fehlen"; exit 1
          fi
      - name: Frontend + App bauen
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build -- --bundles app,dmg
      - name: Signatur prüfen (sonst meldet macOS "beschädigt")
        run: |
          APP=frontend/src-tauri/target/release/bundle/macos/Tagmatti.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -n 8
          DMG=$(ls frontend/src-tauri/target/release/bundle/dmg/*.dmg | head -n 1)
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          codesign --verify --deep --strict --verbose=2 "$MNT/Tagmatti.app"
          hdiutil detach "$MNT"
      - name: DMG hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Tagmatti-macOS
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Smoke-Test (App starten, Einrichtung, Backend erreichbar)
        timeout-minutes: 25
        run: |
          APP=frontend/src-tauri/target/release/bundle/macos/Tagmatti.app
          open "$APP"
          for i in $(seq 1 280); do
            if curl -sf http://127.0.0.1:8765/api/health; then
              echo; echo "Backend läuft nach $((i*5)) s"
              curl -sf http://127.0.0.1:8765/api/licenses | head -c 400; echo
              osascript -e 'quit app "Tagmatti"' || true
              echo "--- RAW-Leser ---"
              PY="$HOME/Library/Application Support/Tagmatti/runtime/venv/bin/python"
              "$PY" -c "import rawpy, os, glob; d=os.path.dirname(rawpy.__file__); print(rawpy.__version__, rawpy.libraw_version); print([os.path.basename(x) for x in glob.glob(d+'/libraw*')])"
              LIB=$(ls "$HOME/Library/Application Support/Tagmatti/runtime/venv/lib/python3.12/site-packages/rawpy/"libraw_r*.dylib | head -n 1)
              for f in "$(dirname "$LIB")"/*.so "$(dirname "$LIB")"/*.dylib; do otool -L "$f"; done > /tmp/rawdeps.txt
              if grep -E "/opt/homebrew|/usr/local" /tmp/rawdeps.txt; then echo "::error::RAW-Leser braucht Homebrew-Bibliotheken"; exit 1; fi
              if strings "$LIB" | grep -q "ILCE-7M5"; then echo "Sony A7 V (ILCE-7M5) wird gelesen"; else echo "::error::RAW-Leser kennt die A7 V nicht"; exit 1; fi
              echo "--- Einrichtung (Auszug) ---"
              grep -v "^\[KI-Pakete" ~/Library/Application\ Support/Tagmatti/logs/setup.log | tail -n 40 || true
              grep -i "übersprungen\|error" ~/Library/Application\ Support/Tagmatti/logs/setup.log | tail -n 20 || true
              exit 0
            fi
            sleep 5
          done
          echo "Backend nicht erreichbar"; ls -la ~/Library/Application\ Support/Tagmatti/ || true
          tail -n 80 ~/Library/Application\ Support/Tagmatti/logs/backend.log || true
          exit 1
      - name: KI-Modelle in der App-Umgebung prüfen (CLIP, Pose)
        timeout-minutes: 20
        continue-on-error: true
        run: |
          PY="$HOME/Library/Application Support/Tagmatti/runtime/venv/bin/python"
          "$PY" scripts/ci_model_check.py
          tail -n 40 ~/Library/Application\ Support/Tagmatti/logs/backend.log || true
      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg

  windows:
    name: Windows-Installer bauen
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: uv ins App-Bundle legen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/src-tauri/bin, frontend/src-tauri/wheels | Out-Null
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath uvx
          $uv = Get-ChildItem uvx -Recurse -Filter uv.exe | Select-Object -First 1
          Copy-Item $uv.FullName frontend/src-tauri/bin/uv
          "Platzhalter: hier liegen mitgelieferte Python-Pakete" | Out-File frontend/src-tauri/wheels/LIESMICH.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: InsightFace vorbauen (Nutzer haben keinen C++-Compiler)
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install -q cython numpy setuptools wheel
          python -m pip wheel insightface==0.7.3 --no-deps --no-build-isolation -w frontend/src-tauri/wheels
          Get-ChildItem frontend/src-tauri/wheels
      - name: Frontend + App bauen
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build -- --bundles nsis
      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Tagmatti-Windows
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Smoke-Test (App starten, Einrichtung, Backend erreichbar)
        timeout-minutes: 30
        shell: pwsh
        run: |
          Start-Process frontend/src-tauri/target/release/tagmatti.exe
          $logs = Join-Path $env:APPDATA "Tagmatti/logs"
          for ($i = 1; $i -le 330; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/health | Out-Null
              Write-Host "Backend läuft nach $($i*5) s"
              Get-Content "$logs/setup.log" -Tail 30 -ErrorAction SilentlyContinue
              Get-Process tagmatti -ErrorAction SilentlyContinue | Stop-Process -Force
              exit 0
            } catch { Start-Sleep 5 }
          }
          Write-Host "Backend nicht erreichbar"
          Get-Content "$logs/setup.log" -Tail 80 -ErrorAction SilentlyContinue
          Get-Content "$logs/backend.log" -Tail 80 -ErrorAction SilentlyContinue
          exit 1
      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe

  website:
    name: Website-Paket (Seite + beide Installer)
    needs: [app, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tagmatti-macOS
          path: dl/mac
      - uses: actions/download-artifact@v4
        with:
          name: Tagmatti-Windows
          path: dl/win
      - name: Zusammenstellen (so in den Ordner der Subdomain laden)
        run: |
          mkdir -p out
          cp -r site/. out/
          cp "$(ls dl/mac/*.dmg | head -n 1)" out/Tagmatti-mac.dmg
          cp "$(ls dl/win/*.exe | head -n 1)" out/Tagmatti-windows-setup.exe
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Tagmatti-Website
          path: out/
          if-no-files-found: error
      # Ohne Windows-Installer: Chrome blockiert ZIPs mit unsignierter .exe als "gefährlich"
      - name: Paket ohne Windows-Installer
        run: |
          mkdir -p out-light
          cp -r out/. out-light/
          rm -f out-light/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Tagmatti-Website-ohne-Windows
          path: out-light/
          if-no-files-found: error
