name: Mac-App

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Python-Umgebung
        working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,scrape]"
          # PyTorch mitinstallieren, damit Konflikte (z. B. OpenMP) auffallen
          uv pip install torch
      - name: Tests
        working-directory: backend
        env:
          IMAGOMAT_OFFLINE: "1"
        run: .venv/bin/python -X faulthandler -m pytest -q

  app:
    name: DMG bauen
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: uv ins App-Bundle legen
        run: |
          mkdir -p frontend/src-tauri/bin
          curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-aarch64-apple-darwin.tar.gz | tar xz
          cp uv-aarch64-apple-darwin/uv frontend/src-tauri/bin/uv
          chmod +x frontend/src-tauri/bin/uv
      - name: Frontend + App bauen
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build -- --bundles app,dmg
      - name: DMG hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Imagomat-macOS
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Smoke-Test (App starten, Einrichtung, Backend erreichbar)
        timeout-minutes: 25
        run: |
          APP=frontend/src-tauri/target/release/bundle/macos/Imagomat.app
          open "$APP"
          for i in $(seq 1 280); do
            if curl -sf http://127.0.0.1:8765/api/health; then
              echo; echo "Backend läuft nach $((i*5)) s"
              curl -sf http://127.0.0.1:8765/api/licenses | head -c 400; echo
              osascript -e 'quit app "Imagomat"' || true
              exit 0
            fi
            sleep 5
          done
          echo "Backend nicht erreichbar"; ls -la ~/Library/Application\ Support/Imagomat/ || true
          tail -n 80 ~/Library/Application\ Support/Imagomat/logs/backend.log || true
          exit 1
      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg
